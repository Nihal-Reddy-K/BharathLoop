<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Centered Circular Loop Icon -->
  <g transform="translate(32, 32) scale(1.1)" filter="url(#shadow)">
    <!-- Top Arc Arrow (Emerald) -->
    <path d="M -13,-3 A 14,14 0 0,1 12,-7" fill="none" stroke="url(#emeraldGrad)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 9,-12 L 15.5,-7 L 9.5,-2 Z" fill="#34d399"/>

    <!-- Bottom Arc Arrow (Teal) -->
    <path d="M 13,3 A 14,14 0 0,1 -12,7" fill="none" stroke="url(#tealGrad)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M -9,12 L -15.5,7 L -9.5,2 Z" fill="#2dd4bf"/>

    <!-- Center Loop Sparkle/Leaf Accent -->
    <circle cx="0" cy="0" r="3" fill="#6ee7b7" fill-opacity="0.9"/>
  </g>
</svg>